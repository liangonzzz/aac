<!-- src/app/organizaciones/organizations-table.component.html -->
<div class="table-container" [class.sidebar-expanded]="isSidebarExpanded">
  <!-- Primer rectángulo: Organizaciones y botón de agregar -->
  <div class="header-rectangle">
    <h3>Organizaciones</h3>
    <button pButton label="Agregar organización" icon="pi pi-plus" class="add-button"></button>
  </div>

  <!-- Segundo rectángulo: Cuadro de búsqueda y botón de buscar -->
  <div class="search-rectangle">
    <div class="search-wrapper">
      <span class="search-icon">
        <i class="pi pi-search"></i>
        <input pInputText type="text" placeholder="Buscar por Razón social" (input)="onGlobalFilter($event)" />
      </span>
      <button pButton label="Buscar" class="search-button"></button>
    </div>
  </div>

  <!-- Tercer rectángulo: Tabla con datos paginados -->
  <div class="table-rectangle">
    <table>
      <thead>
        <tr>
          <th>Logo</th>
          <th>Nombre</th>
          <th>Teléfono</th>
          <th>Correo</th>
          <th>Administración</th>
          <th>Funcionarios</th>
          <th>Candidatos</th>
          <th>Funcionalidades</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let org of paginatedOrganizations">
          <td><img [src]="org.logo" [alt]="'Logo ' + org.name" class="logo-img"></td>
          <td>{{org.name}}</td>
          <td>{{org.phone}}</td>
          <td>{{org.email}}</td>
          <td>{{org.admin}}</td>
          <td>{{org.collaborators}}</td>
          <td>{{org.candidates}}</td>
          <td><button pButton label="Ver" class="action-button"></button></td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Cuarto rectángulo: Paginación y botón de exportar -->
  <div class="footer-rectangle">
    <button pButton label="Exportar a Excel" icon="pi pi-file-excel" class="export-button"></button>
  </div>
</div>
